name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'SPEC.md'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy UI to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Tests
        working-directory: ./frontend
        run: npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy grocery-list-app-ui to Vercel
        working-directory: ./frontend
        run: |
          API_URL="${{ secrets.VITE_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://grocery-list-app-api-bdxnar4rza-uc.a.run.app"
          fi
          echo "Injecting production API URL: $API_URL"
          echo "VITE_API_URL=$API_URL" > .env.production
          echo "VITE_API_URL=$API_URL" > .env
          vercel deploy --prod --scope noam-projects2 --token ${{ secrets.VERCEL_TOKEN }} --yes --build-env VITE_API_URL="$API_URL"


